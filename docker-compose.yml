version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: repomind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repomind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repomind123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - repomind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: repomind-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - repo_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - repomind

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: repomind-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - repomind

volumes:
  pgdata:
  repo_data:

networks:
  repomind:
    driver: bridge
